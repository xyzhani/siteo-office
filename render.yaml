# Hosted demo: PUBLIC_DEMO=true replays fictional sample data with real searches and AI switched off;
# PayPal SANDBOX payments still work. For real runs, self-host with your own keys (see docs/deployment.md).
# Data is a JSON file (no database to expire); the free plan resets it on redeploys, which is fine for a demo.
# One-click "Deploy to Render" blueprint. Render asks for the secret values (sync: false) when you deploy.
services:
  - type: web
    name: siteo-office
    runtime: node
    plan: free
    buildCommand: npm install --omit=dev
    startCommand: node server.js
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: PUBLIC_DEMO
        value: "true"
      - key: PAYPAL_ENV
        value: sandbox
      - key: EMAIL_PROVIDER
        value: test
      - key: SEARCH_PROVIDER
        value: osm
      - key: MAX_AI_USD_PER_RUN
        value: "2"
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_WEBHOOK_ID
        sync: false
      - key: DEMO_BUYER_HINT
        sync: false
